<div class="project-container">
    <div class="project-row">
     
    </div>

    <div id="selectedProjectInfo"></div>
</div>

    <label for="year">Year</label>
	<div id="year" class="year-display"></div>

    <div class="section">
    <h3>Gas Charge Codes</h3>
    <div id="gasCodes">
        <div class="code-row">
            <div class="code-box no-code">
                No charge code available
            </div>
        </div>
    </div>
</div>

<div class="section">
    <h3>Electric Charge Codes</h3>
    <div id="electricCodes">
        <div class="code-row">
            <div class="code-box no-code">
                No charge code available
            </div>
        </div>
    </div>
</div>

   <div class="section">
    <h3>Description</h3>
    <div id="description" class="no-code">
        No description available
    </div>
</div>


<script>


let projects = {};
let groups = {};


const projectDropdown = document.getElementById("project");


let lastCopiedButton = null;

function copyCode(code, button) {

    navigator.clipboard.writeText(code);

    // Reset previously copied button
    if (lastCopiedButton && lastCopiedButton !== button) {
        lastCopiedButton.textContent = "Copy";
        lastCopiedButton.classList.remove("copied");
    }

    // Mark current button as copied
    button.textContent = "Copied!";
    button.classList.add("copied");

    lastCopiedButton = button;
}

function renderCodes(container, codes, label) {
    container.innerHTML = "";

		if (!codes.length) {

			container.innerHTML = `
				<div class="code-row">
					<div class="code-box no-code">
						No charge code available
					</div>
				</div>
			`;

    return;
}

    codes.forEach(code => {
        const row = document.createElement("div");
        row.className = "code-row";

        row.innerHTML = `
		<div class="code-box">
        <span class="code-value">${code}</span>
        <span class="code-note">${label}</span>
		</div>
	<button
        title="Copy charge code to the clipboard"
        onclick="copyCode('${code.replace(/'/g,"\\'")}', this)">
        Copy
    </button>
`;

        container.appendChild(row);
    });
}


function buildData(rows) {

    projects = {};
    groups = {};

    rows.forEach(row => {

        const category =
            String(row["Category"] || "").trim();

        const project =
            String(row["Project"] || "").trim();

        const key =
            `${category}|${project}`;

        projects[key] = {

            year:
                String(row["Year"] || ""),

            gas:
                row["Gas WBS"]
                    ? String(row["Gas WBS"])
                        .split(";")
                        .map(x => x.trim())
                        .filter(Boolean)
                    : [],

            electric:
                row["Electric Rec. Order"]
                    ? String(row["Electric Rec. Order"])
                        .split(";")
                        .map(x => x.trim())
                        .filter(Boolean)
                    : [],

            description:
                row["Description"] || ""

        };

        if (!groups[category]) {
            groups[category] = [];
        }

        groups[category].push(project);

    });

    rebuildDropdown();

}

function rebuildDropdown() {

    projectDropdown.innerHTML =
        '<option value="">Select Project</option>';

    for (const groupName in groups) {

        const optgroup =
            document.createElement("optgroup");

        optgroup.label = groupName;

        groups[groupName].forEach(project => {

            const option =
                document.createElement("option");

            option.value =
                `${groupName}|${project}`;

            option.textContent =
                project;

            optgroup.appendChild(option);

        });

        projectDropdown.appendChild(optgroup);
    }

}


function loadExcelData() {

    return fetch(
        "Project_Charge_Codes_Full.xlsx?t=" + Date.now(),
        { cache: "no-store" }
    )
    .then(r => r.arrayBuffer())
    .then(data => {

        const workbook =
            XLSX.read(data, { type: "array" });

        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];

        const rows =
            XLSX.utils.sheet_to_json(sheet);

        buildData(rows);

    })
    .catch(err => {

        console.error(
            "Excel load failed",
            err
        );

    });

}

projectDropdown.addEventListener("change", function () {

		setTimeout(() => {
		this.style.color =
		this.value === ""
		? "#6b7280"
		: "#333";
		}, 0);


    const project = projects[this.value];
	
	const projectInfo =
    document.getElementById("selectedProjectInfo");

    if (!project) {

	this.classList.add("placeholder");
	this.style.color =
	this.value === "" ? "#6b7280" : "#333";
	
	projectInfo.textContent = "";
	
    document.getElementById("year").textContent = "";

    renderCodes(
        document.getElementById("gasCodes"),
        [],
		"WBS"
	
    );

    renderCodes(
        document.getElementById("electricCodes"),
        [],
		"Rec. Order"
		
    );

	const desc = document.getElementById("description");

	desc.innerHTML = "No description available";
	desc.classList.add("no-code");
	return;
}

    document.getElementById("year").textContent = project.year;
	
	if (this.value.includes("|")) {

    const [groupName, projectName] =
        this.value.split("|");

    projectInfo.innerHTML =
    `<span class="category-pill">
        Category: ${groupName}
    </span>`;

} else {

	this.classList.remove("placeholder");
    projectInfo.textContent = "";

}

    renderCodes(
        document.getElementById("gasCodes"),
        project.gas,
		"WBS"
    );

    renderCodes(
        document.getElementById("electricCodes"),
        project.electric,
		"Rec. Order"
    );

	const desc = document.getElementById("description");

if (project.description && project.description.trim() !== "") {
    desc.innerHTML = project.description;
    desc.classList.remove("no-code");
} else {
    desc.innerHTML = "No description available";
    desc.
	classList.add("no-code");
}
	
});


loadExcelData();

document.getElementById("refreshBtn")
.addEventListener("click", function () {

    const button = this;

    button.disabled = true;

    loadExcelData()
    .then(() => {

        button.classList.add("refresh-success");
		button.innerHTML = "Refresh Complete!";
		

        setTimeout(() => {
			
			button.classList.remove("refresh-success");
            button.innerHTML = "Refresh";
            button.disabled = false;

        }, 2000);


    });

});
</script>
